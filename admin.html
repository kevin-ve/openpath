<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OpenPath Admin</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f3f6f2;color:#10231c;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}
input,select,textarea{width:100%;padding:10px;border:1px solid #c9d6cb;border-radius:8px;font:inherit;margin-bottom:8px}
button{background:#0e5a43;color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;margin:2px}
button.red{background:#b3261e}button.tab{background:#fff;color:#10231c;border:1px solid #c9d6cb}
.card{background:#fff;border:1px solid #dde5dc;border-radius:12px;padding:14px;margin-bottom:12px}
.stat{display:inline-block;margin-right:20px}.stat b{font-size:1.4rem;display:block}
</style>
</head>
<body><div class="wrap">
<h2>OpenPath Admin</h2>

<div id="login" class="card" style="max-width:360px">
  <input id="em" type="email" placeholder="Admin email"><input id="pw" type="password" placeholder="Password">
  <button onclick="signIn()">Log in</button> <span id="lerr"></span>
</div>

<div id="app" style="display:none">
  <div class="card" id="stats"></div>
  <button class="tab" onclick="show('req')">Requests</button>
  <button class="tab" onclick="show('opp')">Opportunities</button>
  <button class="tab" onclick="show('svc')">Services</button>
  <button class="red" onclick="db.auth.signOut().then(()=>location.reload())">Log out</button>

  <div id="req"></div>

  <div id="opp" style="display:none">
    <div class="card"><h3>Add opportunity</h3>
      <input id="o_title" placeholder="Title"><select id="o_cat"><option>Scholarship</option><option>Job</option><option>Internship</option><option>Grant</option><option>Competition</option><option>Fellowship</option><option>Training</option></select>
      <textarea id="o_desc" placeholder="Description"></textarea><input id="o_elig" placeholder="Eligibility"><input id="o_ben" placeholder="Benefits">
      <input id="o_loc" placeholder="Location"><input id="o_dead" type="date"><input id="o_docs" placeholder="Required documents"><input id="o_link" placeholder="Official application link (https://…)">
      <button onclick="addOpp()">Save opportunity</button></div>
    <div id="oppList"></div>
  </div>

  <div id="svc" style="display:none"><div id="svcList"></div></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="PASTE_SUPABASE_URL", SB_KEY="PASTE_ANON_PUBLIC_KEY";   // same as the site
const db=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS=["awaiting_verification","paid","in_progress","completed","rejected"];

async function signIn(){
  const {error}=await db.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  if(error){$("lerr").textContent="Wrong email or password";return;} start();
}
async function start(){
  const {data}=await db.auth.getSession(); if(!data.session)return;
  $("login").style.display="none"; $("app").style.display=""; loadAll();
}
function show(id){["req","opp","svc"].forEach(x=>$(x).style.display=x==id?"":"none");}
async function loadAll(){ await Promise.all([loadReq(),loadOpp(),loadSvc()]); }

async function loadReq(){
  const {data}=await db.from("requests").select("*").order("created_at",{ascending:false});
  const rows=data||[];
  const paid=rows.filter(r=>["paid","in_progress","completed"].includes(r.status));
  const today=new Date().toISOString().slice(0,10), month=today.slice(0,7);
  const sum=a=>a.reduce((t,r)=>t+r.amount,0).toLocaleString();
  $("stats").innerHTML=`<span class="stat"><b>${rows.filter(r=>r.status=="awaiting_verification").length}</b>to verify</span>
   <span class="stat"><b>${sum(paid)} RWF</b>total revenue</span>
   <span class="stat"><b>${sum(paid.filter(r=>r.created_at.startsWith(month)))} RWF</b>this month</span>`;
  $("req").innerHTML=rows.map(r=>`<div class="card"><b>${esc(r.ref)}</b> | ${esc(r.service_name)} | ${r.amount.toLocaleString()} RWF<br>
   ${esc(r.name)} | ${esc(r.phone)} | ${esc(r.email)} | via ${esc(r.contact_pref)}<br>
   Opportunity: ${esc(r.opportunity)}<br>Documents: ${/^https?:\/\//.test(r.doc_link||"")?`<a href="${esc(r.doc_link)}" target="_blank" rel="noopener">open</a>`:esc(r.doc_link)}<br>
   Message: ${esc(r.message)}<br><b>MoMo ID: ${esc(r.momo_txn)}</b> (match it with your SMS) | ${new Date(r.created_at).toLocaleString()}
   <select id="s_${r.id}">${STATUS.map(s=>`<option ${s==r.status?"selected":""}>${s}</option>`).join("")}</select>
   <input id="n_${r.id}" placeholder="Note shown to customer" value="${esc(r.admin_note)}">
   <button onclick="saveReq('${r.id}')">Save</button>
   <a href="https://wa.me/${encodeURIComponent(r.phone.replace(/\D/g,""))}" target="_blank" rel="noopener"><button>WhatsApp</button></a></div>`).join("")||"<p>No requests yet.</p>";
}
async function saveReq(id){
  await db.from("requests").update({status:$("s_"+id).value,admin_note:$("n_"+id).value}).eq("id",id); loadReq();
}

async function loadOpp(){
  const {data}=await db.from("opportunities").select("*").order("created_at",{ascending:false});
  $("oppList").innerHTML=(data||[]).map(o=>`<div class="card"><b>${esc(o.title)}</b> (${esc(o.category)}) | deadline ${esc(o.deadline||"open")} | ${o.published?"published":"hidden"}<br>
   <button onclick="togglePub('${o.id}',${!o.published})">${o.published?"Hide":"Publish"}</button>
   <button onclick="reverify('${o.id}')">Mark verified today</button>
   <button class="red" onclick="delOpp('${o.id}')">Delete</button></div>`).join("");
}
async function addOpp(){
  const {error}=await db.from("opportunities").insert({title:$("o_title").value,category:$("o_cat").value,description:$("o_desc").value,
   eligibility:$("o_elig").value,benefits:$("o_ben").value,location:$("o_loc").value,deadline:$("o_dead").value||null,
   required_docs:$("o_docs").value,link:$("o_link").value});
  if(error){alert("Could not save: "+error.message);return;}
  document.querySelectorAll("#opp input,#opp textarea").forEach(i=>i.value=""); loadOpp();
}
async function togglePub(id,v){await db.from("opportunities").update({published:v}).eq("id",id);loadOpp();}
async function reverify(id){await db.from("opportunities").update({verified_at:new Date().toISOString().slice(0,10)}).eq("id",id);loadOpp();}
async function delOpp(id){if(confirm("Delete this opportunity?")){await db.from("opportunities").delete().eq("id",id);loadOpp();}}

async function loadSvc(){
  const {data}=await db.from("services").select("*").order("price");
  $("svcList").innerHTML=(data||[]).map(s=>`<div class="card"><b>${esc(s.name)}</b>
   <input id="p_${s.id}" type="number" value="${s.price}"> <label><input type="checkbox" id="a_${s.id}" ${s.active?"checked":""} style="width:auto"> active</label>
   <button onclick="saveSvc('${s.id}')">Save</button></div>`).join("");
}
async function saveSvc(id){await db.from("services").update({price:+$("p_"+id).value,active:$("a_"+id).checked}).eq("id",id);loadSvc();}
start();
</script>
</body>
</html>
